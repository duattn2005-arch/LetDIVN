# Decap CMS — where the site's lists are edited: News, Videos, Partners, Team,
# Gallery, What We Do, Who We Are sections and Media on Us.
# Every save is a commit to the GitHub repo below; the live site reads the
# content from GitHub (server/cmsContent.ts), so there is no rebuild step.
#
# Paths are relative to the REPO root, which contains this app in LetDIVN-main/.

backend:
  name: github
  repo: duattn2005-arch/LetDIVN
  branch: main
  # GitHub login goes through our own server (server/routes/decapAuth.ts).
  base_url: https://letsdoitvietnam.online
  auth_endpoint: api/decap/auth
  auth_scope: public_repo
  commit_messages:
    create: 'Thêm {{collection}}: {{slug}}'
    update: 'Sửa {{collection}}: {{slug}}'
    delete: 'Xóa {{collection}}: {{slug}}'
    uploadMedia: 'Tải ảnh: {{path}}'
    deleteMedia: 'Xóa ảnh: {{path}}'

# On localhost only: edit the files on disk instead of GitHub.
# Run `npx decap-server` from the repo root alongside `npm run dev`.
local_backend: true

locale: vi
site_url: https://letsdoitvietnam.online
display_url: https://letsdoitvietnam.online

# Uploads go to public/images/cms/ (News keeps its own folder, see below).
media_folder: LetDIVN-main/public/images/cms
public_folder: /images/cms

# Vietnamese titles -> plain ascii file names (e.g. "Ngày hội" -> "ngay-hoi").
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: news
    label: Tin tức
    label_singular: bài viết
    description: Các bài viết hiển thị ở trang News của website.
    folder: LetDIVN-main/content/news
    media_folder: /LetDIVN-main/public/images/news
    public_folder: /images/news
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{date}} · {{title}}'
    sortable_fields: [date, title]
    fields:
      # Original database id of migrated articles (homepage picker stores ids).
      - { label: ID, name: id, widget: hidden, required: false }
      - { label: Tiêu đề, name: title, widget: string }
      - label: Chuyên mục
        name: category
        widget: select
        default: News
        options:
          - { label: 'Tin tức (News)', value: 'News' }
          - { label: 'Báo chí viết về chúng tôi (Media On Us)', value: 'Media On Us' }
          - { label: 'Thông cáo báo chí (Press Release)', value: 'Press Release' }
          - { label: 'Câu chuyện tác động (Impact Story)', value: 'Impact Story' }
      - label: Ngày đăng
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD/MM/YYYY'
        time_format: false
      - { label: Tác giả, name: author, widget: string, required: false }
      - { label: Ảnh đại diện, name: image, widget: image, hint: 'Ảnh hiển thị trên thẻ bài viết.' }
      - { label: Tóm tắt, name: summary, widget: text, hint: 'Vài câu ngắn hiển thị dưới tiêu đề trong danh sách bài viết.' }
      - label: Nội dung
        name: contentBlocks
        widget: list
        label_singular: khối
        hint: 'Thêm đoạn văn và ảnh theo đúng thứ tự muốn hiển thị. Kéo để sắp xếp lại.'
        types:
          - label: Đoạn văn
            name: text
            widget: object
            summary: '{{fields.value}}'
            fields:
              - { label: Đoạn văn, name: value, widget: text }
          - label: Ảnh
            name: image
            widget: object
            summary: '{{fields.value}}'
            fields:
              - { label: Ảnh, name: value, widget: image }
      - { label: Nguồn (tên báo), name: source, widget: string, required: false }
      - { label: Link bài gốc, name: sourceUrl, widget: string, required: false }
      - { label: Nổi bật, name: featured, widget: boolean, default: false, required: false }
      - label: Trạng thái
        name: status
        widget: select
        default: Published
        options:
          - { label: 'Đã đăng', value: 'Published' }
          - { label: 'Chờ duyệt (chỉ admin thấy)', value: 'Pending' }

  # --- Lists below are shown in the order of the "Thứ tự" (order) field, smallest first.

  - name: videos
    label: Videos
    label_singular: video
    description: Video YouTube ở mục "Capturing Change, One Frame at a Time".
    folder: LetDIVN-main/content/videos
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{order}} · {{title}}'
    sortable_fields: [order, title]
    fields:
      - { label: ID, name: id, widget: hidden, required: false }
      - { label: Tiêu đề, name: title, widget: string }
      - { label: Link YouTube, name: youtube, widget: string, hint: 'Dán link dạng https://www.youtube.com/watch?v=... hoặc https://youtu.be/...' }
      - { label: Thứ tự, name: order, widget: number, default: 0, value_type: int, hint: 'Số nhỏ hiện trước. Để 0 để video mới lên đầu.' }
      - { label: Ngày thêm, name: addedAt, widget: hidden, required: false }

  - name: partners
    label: Đối tác
    label_singular: đối tác
    description: Logo đối tác ở trang Our Partners.
    folder: LetDIVN-main/content/partners
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{name}}'
    identifier_field: name
    summary: '{{order}} · {{name}}'
    sortable_fields: [order, name]
    fields:
      - { label: ID, name: id, widget: hidden, required: false }
      - { label: Tên, name: name, widget: string }
      - { label: Logo, name: logo, widget: image }
      - { label: Website, name: website, widget: string, required: false }
      - label: Hạng
        name: tier
        widget: select
        default: Community
        options: [Diamond, Gold, Silver, Community, Media]
      - { label: Loại hình, name: type, widget: string, required: false, hint: 'Ví dụ: Corporate, NGO, University' }
      - { label: Mô tả, name: description, widget: text, required: false }
      - { label: Năm bắt đầu hợp tác, name: joinedYear, widget: number, value_type: int, required: false }
      - { label: Tỉ lệ logo (%), name: scale, widget: number, value_type: int, default: 100, min: 50, max: 180, required: false, hint: 'Phóng to/thu nhỏ logo. 100 = kích thước chuẩn.' }
      - { label: Thứ tự, name: order, widget: number, default: 0, value_type: int, hint: 'Số nhỏ hiện trước.' }

  - name: team
    label: Đội ngũ
    label_singular: thành viên
    description: Thành viên ở trang Our Team.
    folder: LetDIVN-main/content/team
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{name}}'
    identifier_field: name
    summary: '{{order}} · {{name}} — {{role}}'
    sortable_fields: [order, name]
    fields:
      - { label: ID, name: id, widget: hidden, required: false }
      - { label: Họ tên, name: name, widget: string }
      - { label: Chức vụ, name: role, widget: string }
      - { label: Ảnh, name: avatar, widget: image }
      - { label: Bộ phận, name: department, widget: string, required: false }
      - { label: Giới thiệu, name: bio, widget: text, required: false }
      - { label: LinkedIn, name: linkedin, widget: string, required: false }
      - { label: Facebook, name: facebook, widget: string, required: false }
      - { label: Email, name: email, widget: string, required: false }
      - { label: Thứ tự, name: order, widget: number, default: 99, value_type: int, hint: 'Số nhỏ hiện trước.' }

  - name: gallery
    label: Thư viện ảnh
    label_singular: ảnh
    description: Ảnh ở trang Gallery.
    folder: LetDIVN-main/content/gallery
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{year}} · {{title}}'
    sortable_fields: [order, year, title]
    fields:
      - { label: ID, name: id, widget: hidden, required: false }
      - { label: Tiêu đề, name: title, widget: string }
      - { label: Ảnh, name: imageUrl, widget: image }
      - { label: Năm, name: year, widget: number, value_type: int }
      - { label: Tỉnh / thành phố, name: city, widget: string, required: false }
      - { label: Sự kiện, name: eventName, widget: string, required: false }
      - { label: Chủ đề, name: category, widget: string, required: false }
      - { label: Chú thích, name: caption, widget: text, required: false }
      - { label: Thứ tự, name: order, widget: number, default: 0, value_type: int, hint: 'Số nhỏ hiện trước. Để 0 để ảnh mới lên đầu.' }

  - name: what-we-do
    label: What We Do
    label_singular: hoạt động
    description: Các khối ảnh + chữ ở trang What We Do.
    folder: LetDIVN-main/content/what-we-do
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{order}} · {{title}}'
    sortable_fields: [order, title]
    fields:
      - { label: ID, name: id, widget: hidden, required: false }
      - { label: Tiêu đề, name: title, widget: string }
      - { label: Nội dung, name: desc, widget: text }
      - { label: Ảnh, name: image, widget: image }
      - label: Vị trí ảnh
        name: layout
        widget: select
        default: image-left
        options:
          - { label: 'Ảnh bên trái', value: image-left }
          - { label: 'Ảnh bên phải', value: image-right }
      - { label: Thứ tự, name: order, widget: number, default: 99, value_type: int, hint: 'Số nhỏ hiện trước.' }

  - name: who-we-are
    label: Who We Are
    label_singular: mục
    description: Các khối ảnh + chữ bổ sung ở cuối trang Who We Are.
    folder: LetDIVN-main/content/who-we-are
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{order}} · {{title}}'
    sortable_fields: [order, title]
    fields:
      - { label: ID, name: id, widget: hidden, required: false }
      - { label: Tiêu đề, name: title, widget: string }
      - { label: Nội dung, name: desc, widget: text }
      - { label: Ảnh, name: image, widget: image }
      - label: Vị trí ảnh
        name: layout
        widget: select
        default: image-left
        options:
          - { label: 'Ảnh bên trái', value: image-left }
          - { label: 'Ảnh bên phải', value: image-right }
      - { label: Thứ tự, name: order, widget: number, default: 99, value_type: int, hint: 'Số nhỏ hiện trước.' }

  - name: media-coverage
    label: Media on Us
    label_singular: mục báo chí
    description: Các năm báo chí đưa tin ở trang Media on Us.
    folder: LetDIVN-main/content/media-coverage
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{order}} · {{title}}'
    sortable_fields: [order, title]
    fields:
      - { label: ID, name: id, widget: hidden, required: false }
      - { label: Tiêu đề (chữ trên nút), name: title, widget: string }
      - { label: Ảnh, name: image, widget: image }
      - { label: Số bài báo, name: articleCount, widget: number, value_type: int, default: 0 }
      - { label: Số phóng sự, name: segmentCount, widget: number, value_type: int, default: 0 }
      - { label: File PDF / link tổng hợp, name: pdfUrl, widget: file, hint: 'Tải file PDF lên hoặc dán link.' }
      - { label: Thứ tự, name: order, widget: number, default: 99, value_type: int, hint: 'Số nhỏ hiện trước.' }
