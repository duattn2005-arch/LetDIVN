      preview: false
    files:
      - label: "Đầu trang (dòng chữ chạy & menu Other)"
        name: "header"
        file: LetDIVN-main/content/page-content/header.json
        fields:
          - { label: "Top Announcement", name: "topAnnouncement", widget: text, required: false }
          - { label: "Top Tagline", name: "topTagline", widget: text, required: false }
          - { label: "Other Media Label", name: "otherMediaLabel", widget: string, required: false }
          - { label: "Other News Label", name: "otherNewsLabel", widget: string, required: false }
          - { label: "Other Videos Label", name: "otherVideosLabel", widget: string, required: false }
          - { label: "Other Photo Gallery", name: "otherPhotoGallery", widget: string, required: false }
      - label: "Trang chủ · Banner"
        name: "hero"
        file: LetDIVN-main/content/page-content/hero.json
