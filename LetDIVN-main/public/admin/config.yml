# Decap CMS — the only place the site is edited: the text and images of every
# page, Cleanup Map events, News, Videos, Partners, Team, Gallery, What We Do,
# Who We Are sections and Media on Us. The site itself has no login.
# Every save is a commit to the GitHub repo below; the live site reads the
# content from GitHub (server/cmsContent.ts), so there is no rebuild step.
#
# Paths are relative to the REPO root, which contains this app in LetDIVN-main/.

backend:
  name: github
  repo: duattn2005-arch/LetDIVN
  branch: main
  # GitHub login goes through our own server (server/routes/decapAuth.ts).
  base_url: https://letsdoitvietnam.online
  auth_endpoint: api/decap/auth
  auth_scope: public_repo
  commit_messages:
    create: 'Thêm {{collection}}: {{slug}}'
    update: 'Sửa {{collection}}: {{slug}}'
    delete: 'Xóa {{collection}}: {{slug}}'
    uploadMedia: 'Tải ảnh: {{path}}'
    deleteMedia: 'Xóa ảnh: {{path}}'

# On localhost only: edit the files on disk instead of GitHub.
# Run `npx decap-server` from the repo root alongside `npm run dev`.
local_backend: true

locale: vi
site_url: https://letsdoitvietnam.online
display_url: https://letsdoitvietnam.online

# Uploads go to public/images/cms/ (News keeps its own folder, see below).
media_folder: LetDIVN-main/public/images/cms
public_folder: /images/cms

# Vietnamese titles -> plain ascii file names (e.g. "Ngày hội" -> "ngay-hoi").
slug:
  encoding: ascii
  clean_accents: true

collections:
  # --- Text and images of every page. Each file is one page; the field names
  # map to the contentKey of EditableText / EditableImage in the code
  # (e.g. project.wildlife-nature.json -> section1 -> p0 = "project.wildlife-nature.section1.p0").
  # A field left empty shows the text built into the code.
  - name: pages
    label: Nội dung các trang
    label_singular: trang
    description: Chữ và ảnh trên từng trang của website. Bấm vào một trang, sửa rồi bấm Publish.
    media_folder: /LetDIVN-main/public/images/cms
    public_folder: /images/cms
