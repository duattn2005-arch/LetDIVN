  - name: news
    label: Tin tức
    label_singular: bài viết
    description: Các bài viết hiển thị ở trang News của website.
    folder: LetDIVN-main/content/news
    media_folder: /LetDIVN-main/public/images/news
    public_folder: /images/news
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{date}} · {{title}}'
    sortable_fields: [date, title]
    fields:
      # Original database id of migrated articles (homepage picker stores ids).
      - { label: ID, name: id, widget: hidden, required: false }
      - { label: Tiêu đề, name: title, widget: string }
      - label: Chuyên mục
        name: category
        widget: select
        default: News
        options:
          - { label: 'Tin tức (News)', value: 'News' }
          - { label: 'Báo chí viết về chúng tôi (Media On Us)', value: 'Media On Us' }
          - { label: 'Thông cáo báo chí (Press Release)', value: 'Press Release' }
          - { label: 'Câu chuyện tác động (Impact Story)', value: 'Impact Story' }
      - label: Ngày đăng
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD/MM/YYYY'
        time_format: false
      - { label: Tác giả, name: author, widget: string, required: false }
      - { label: Ảnh đại diện, name: image, widget: image, hint: 'Ảnh hiển thị trên thẻ bài viết.' }
      - { label: Tóm tắt, name: summary, widget: text, hint: 'Vài câu ngắn hiển thị dưới tiêu đề trong danh sách bài viết.' }
      - label: Nội dung
        name: contentBlocks
        widget: list
        label_singular: khối
        hint: 'Thêm đoạn văn và ảnh theo đúng thứ tự muốn hiển thị. Kéo để sắp xếp lại.'
        types:
          - label: Đoạn văn
            name: text
            widget: object
            summary: '{{fields.value}}'
            fields:
              - { label: Đoạn văn, name: value, widget: text }
          - label: Ảnh
            name: image
            widget: object
            summary: '{{fields.value}}'
            fields:
              - { label: Ảnh, name: value, widget: image }
      - { label: Nguồn (tên báo), name: source, widget: string, required: false }
      - { label: Link bài gốc, name: sourceUrl, widget: string, required: false }
      - { label: Nổi bật, name: featured, widget: boolean, default: false, required: false }
      - label: Trạng thái
        name: status
        widget: select
        default: Published
        options:
          - { label: 'Đã đăng', value: 'Published' }
          - { label: 'Chờ duyệt (chỉ admin thấy)', value: 'Pending' }

  - name: events
    label: Sự kiện (Cleanup Map)
    label_singular: sự kiện
    description: Các sự kiện / điểm dọn rác hiện trên Cleanup Map, trang Projects và nút đăng ký tình nguyện viên.
    folder: LetDIVN-main/content/events
    media_folder: /LetDIVN-main/public/images/cms
    public_folder: /images/cms
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{date}} · {{city}} · {{title}}'
    sortable_fields: [order, date, title]
    editor:
      preview: false
    fields:
      # Original database id of migrated events: volunteer sign-ups and links use it.
      - { label: ID, name: id, widget: hidden, required: false }
      - { label: Tên sự kiện, name: title, widget: string }
      - label: Dự án
        name: category
        widget: select
        default: World Cleanup Day
        options:
          - World Cleanup Day
          - Environmental Day
          - Green Ocean Campaign
          - { label: 'Young Conservationists Save The Wildlife', value: 'Wildlife & Nature' }
          - { label: 'Community Workshop', value: 'Workshop & Education' }
      - label: Trạng thái
        name: status
        widget: select
        default: Upcoming
        options:
          - { label: 'Sắp diễn ra', value: 'Upcoming' }
          - { label: 'Đang diễn ra', value: 'Ongoing' }
          - { label: 'Đã kết thúc', value: 'Completed' }
      - { label: Ngày, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false }
      - { label: Giờ, name: time, widget: string, required: false, hint: 'Ví dụ: 07:00 - 11:30' }
      - { label: Địa điểm, name: location, widget: string }
      - { label: Tỉnh / thành phố, name: city, widget: string, hint: 'Dùng để tạo link trang chiến dịch, ví dụ "Da Nang" -> /explore-campaigns/da-nang/' }
      - label: Tọa độ trên bản đồ
        name: coordinates
        widget: object
        required: false
        hint: 'Mở Google Maps, chuột phải vào điểm rồi bấm vào dòng số đầu tiên để copy (vĩ độ, kinh độ).'
        fields:
          - { label: Vĩ độ (lat), name: lat, widget: number, value_type: float, required: false }
          - { label: Kinh độ (lng), name: lng, widget: number, value_type: float, required: false }
      - { label: Link Google Maps, name: googleMapsUrl, widget: string, required: false }
      - { label: Ảnh, name: image, widget: image, choose_url: true }
      - { label: Ảnh banner, name: bannerImage, widget: image, choose_url: true, required: false }
      - { label: Mô tả, name: description, widget: text }
      - { label: Số tình nguyện viên cần, name: targetVolunteers, widget: number, value_type: int, default: 100 }
      - { label: Rác thu gom (kg), name: trashCollectedKg, widget: number, value_type: int, default: 0, required: false }
      - { label: Trưởng nhóm, name: leader, widget: string, required: false }
      - { label: Điểm tập trung, name: meetingPoint, widget: string, required: false }
      - { label: Link Google Sheet riêng, name: sheetUrl, widget: string, required: false, hint: 'Để trống để dùng Google Sheet chung.' }
      - label: Lịch trình
        name: schedule
        widget: list
        required: false
        label_singular: mốc
        summary: '{{fields.time}} · {{fields.activity}}'
        fields:
          - { label: Giờ, name: time, widget: string }
          - { label: Hoạt động, name: activity, widget: string }
      - { label: Thứ tự, name: order, widget: number, default: 99, value_type: int, hint: 'Số nhỏ hiện trước.' }

