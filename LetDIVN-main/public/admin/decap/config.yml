  # --- The Projects list page, and the five project story pages
  # (/world-cleanup-day/, /wildlife-nature/, ...) in content/project-pages/,
  # whose sections, paragraphs and photos can be added, removed and reordered.
  - name: projects
    label: Dự án
    label_singular: dự án
    description: Chữ và ảnh của các trang dự án (World Cleanup Day, YCSW, Green Ocean...) và trang Projects. Sự kiện theo ngày nằm ở mục "Sự kiện (Cleanup Map)".
    media_folder: /LetDIVN-main/public/images/cms
    public_folder: /images/cms
    editor:
      preview: false
    files:
      - label: "Trang Projects / Explore Campaigns"
        name: "projects"
        file: LetDIVN-main/content/page-content/projects.json
        fields:
          - { label: "Tiêu đề", name: "title", widget: string, required: false }
          - { label: "Tiêu đề phụ", name: "subtitle", widget: text, required: false }
          - { label: "View Details Btn", name: "viewDetailsBtn", widget: string, required: false }
          - { label: "Register Btn", name: "registerBtn", widget: string, required: false }
      - label: "Dự án · World Cleanup Day"
        name: "world-cleanup-day"
        file: LetDIVN-main/content/project-pages/world-cleanup-day.json
        fields: &projectPageFields
          # Which events use this page (CleanupEvent.category); not editable.
          - { label: Dự án, name: category, widget: hidden }
          - { label: Ảnh bìa, name: hero, widget: image, choose_url: true }
          - { label: Vị trí cắt ảnh bìa, name: heroPosition, widget: string, required: false, hint: 'Ví dụ "50% 30%" (ngang, dọc). Để trống = giữa ảnh.' }
          - { label: Dòng chữ nhỏ trên tiêu đề, name: kicker, widget: string, required: false }
          - { label: Tiêu đề trang, name: title, widget: string }
          - { label: Màu tiêu đề, name: titleColor, widget: string, required: false, hint: 'Mã màu, ví dụ #F1138D. Để trống = hồng.' }
          - label: Các phần
            name: sections
            widget: list
            label_singular: phần
            summary: '{{fields.heading}}{{fields.personListItem}} {{fields.paragraphs | truncate(90)}}'
            hint: 'Mỗi phần là một dải trên trang. Bấm "Add phần" để thêm, bấm vào một phần để sửa, kéo để đổi thứ tự.'
            fields:
              - { label: Tiêu đề phần, name: heading, widget: string, required: false }
              - { label: Tiêu đề to ở giữa (kiểu tiêu đề trang), name: headingAsTitle, widget: boolean, default: false, required: false }
              - label: Đoạn văn
                name: paragraphs
                widget: list
                label_singular: đoạn
                required: false
