                name: textAlign
                widget: select
                required: false
                options:
                  - { label: 'Trái', value: left }
                  - { label: 'Giữa', value: center }
                  - { label: 'Đều hai bên', value: justify }
              - { label: Ảnh bên cạnh chữ, name: image, widget: image, choose_url: true, required: false, hint: 'Có ảnh thì phần hiện ảnh + chữ cạnh nhau (trái/phải xen kẽ).' }
              - label: Bộ ảnh bên dưới
                name: gallery
                widget: list
                label_singular: ảnh
                required: false
                field: { label: Ảnh, name: image, widget: image, choose_url: true }
              - &galleryAspect
                label: Tỉ lệ ảnh trong bộ ảnh
                name: galleryAspect
                widget: select
                required: false
                options:
                  - { label: '3:2 (mặc định)', value: '3/2' }
                  - { label: '4:3', value: '4/3' }
                  - { label: 'Vuông', value: square }
                  - { label: 'Ảnh ngang dài (7:2)', value: '7/2' }
              - label: Hai cột cạnh nhau
                name: columns
                widget: list
                label_singular: cột
                required: false
                summary: '{{fields.heading}}'
                fields:
                  - { label: Tiêu đề cột, name: heading, widget: string, required: false }
                  - label: Các dòng
                    name: paragraphs
                    widget: list
                    label_singular: dòng
                    field: { label: Dòng, name: paragraph, widget: text }
              - label: Khối con (tiêu đề đậm + đoạn văn + ảnh)
                name: subBlocks
                widget: list
                label_singular: khối
                required: false
                summary: '{{fields.title}}'
                fields:
                  - { label: Tiêu đề đậm, name: title, widget: string, required: false }
                  - { label: Đoạn văn, name: text, widget: text, required: false }
                  - label: Bộ ảnh
                    name: gallery
                    widget: list
                    label_singular: ảnh
                    required: false
                    field: { label: Ảnh, name: image, widget: image, choose_url: true }
                  - *galleryAspect
              - label: Đoạn kết
                name: closingParagraphs
                widget: list
                label_singular: đoạn
                required: false
                hint: 'Đoạn đầu hiện trước danh sách gạch đầu dòng bên dưới, các đoạn sau hiện sau nó.'
                field: { label: Đoạn văn, name: paragraph, widget: text }
              - { label: Dòng giới thiệu danh sách kết, name: closingBulletsLabel, widget: string, required: false }
              - label: Danh sách gạch đầu dòng kết
                name: closingBullets
