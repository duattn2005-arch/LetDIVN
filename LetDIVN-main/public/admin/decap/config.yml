  - name: news
    label: Tin tức
    label_singular: bài viết
    description: Các bài viết hiển thị ở trang News của website.
    folder: LetDIVN-main/content/news
    media_folder: /LetDIVN-main/public/images/news
    public_folder: /images/news
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{date}} · {{title}}'
    sortable_fields: [date, title]
    fields:
      # Original database id of migrated articles (homepage picker stores ids).
      - { label: ID, name: id, widget: hidden, required: false }
      - { label: Tiêu đề, name: title, widget: string }
      - label: Chuyên mục
        name: category
        widget: select
        default: News
        options:
          - { label: 'Tin tức (News)', value: 'News' }
          - { label: 'Báo chí viết về chúng tôi (Media On Us)', value: 'Media On Us' }
          - { label: 'Thông cáo báo chí (Press Release)', value: 'Press Release' }
          - { label: 'Câu chuyện tác động (Impact Story)', value: 'Impact Story' }
      - label: Ngày đăng
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD/MM/YYYY'
        time_format: false
      - { label: Tác giả, name: author, widget: string, required: false }
      - { label: Ảnh đại diện, name: image, widget: image, hint: 'Ảnh hiển thị trên thẻ bài viết.' }
      - { label: Tóm tắt, name: summary, widget: text, hint: 'Vài câu ngắn hiển thị dưới tiêu đề trong danh sách bài viết.' }
      - label: Nội dung
        name: contentBlocks
        widget: list
        label_singular: khối
        hint: 'Thêm đoạn văn và ảnh theo đúng thứ tự muốn hiển thị. Kéo để sắp xếp lại.'
        types:
          - label: Đoạn văn
            name: text
            widget: object
            summary: '{{fields.value}}'
            fields:
              - { label: Đoạn văn, name: value, widget: text }
          # Paragraphs with bold/headings/lists, written in the WordPress-style editor at /admin/.
          - label: Đoạn văn có định dạng (HTML)
            name: html
            widget: object
            summary: '{{fields.value}}'
            fields:
              - { label: HTML, name: value, widget: text }
          - label: Ảnh
            name: image
            widget: object
            summary: '{{fields.value}}'
            fields:
              - { label: Ảnh, name: value, widget: image }
      - { label: Nguồn (tên báo), name: source, widget: string, required: false }
      - { label: Link bài gốc, name: sourceUrl, widget: string, required: false }
      - { label: Nổi bật, name: featured, widget: boolean, default: false, required: false }
      - label: Trạng thái
        name: status
        widget: select
        default: Published
        options:
          - { label: 'Đã đăng', value: 'Published' }
          - { label: 'Chờ duyệt (chỉ admin thấy)', value: 'Pending' }
      - { label: Thẻ, name: tags, widget: list, required: false, hint: 'Các thẻ, phân cách bằng dấu phẩy.' }
      # SEO: the page title / description search engines and Facebook show for /news/<slug>/.
      - { label: Cụm từ khóa chính (SEO), name: seoKeyphrase, widget: string, required: false }
      - { label: Tiêu đề SEO, name: seoTitle, widget: string, required: false, hint: 'Để trống = dùng tiêu đề bài viết.' }
      - { label: Mô tả meta (SEO), name: seoDescription, widget: text, required: false, hint: 'Để trống = dùng phần tóm tắt.' }

  - name: events
    label: Sự kiện (Cleanup Map)
    label_singular: sự kiện
    description: Các sự kiện / điểm dọn rác hiện trên Cleanup Map, trang Projects và nút đăng ký tình nguyện viên.
    folder: LetDIVN-main/content/events
