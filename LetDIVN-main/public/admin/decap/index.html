<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Quản lý bài viết · Let's Do It! Vietnam</title>
    <style>
      /* Login screen: just the "Đăng nhập" button — no GitHub icon, no "back to site" link. */
      [class*="LoginButtonIcon"],
      [class*="GoBackButtonStyle"] { display: none !important; }
    </style>
  </head>
  <body>
    <!-- Decap CMS: reads config.yml next to this file. -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@^3.16.0/dist/decap-cms.js"></script>
    <script>
      // The login popup asks for the admin username/password first
      // (server/routes/decapAuth.ts), so the button just says "Đăng nhập".
      var vi = CMS.getLocale('vi');
      vi.auth.loginWithGitHub = 'Đăng nhập';
      CMS.registerLocale('vi', vi);
      CMS.init();
    </script>
  </body>
</html>
