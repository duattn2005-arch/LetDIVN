<div style="font-family: Arial, Helvetica, sans-serif; background:#f8fafc; padding:24px;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
    <div style="background:linear-gradient(135deg,#0f172a,#E81A7F);padding:28px 24px;text-align:center;color:#ffffff;">
      <div style="font-size:13px;font-weight:700;letter-spacing:0.5px;opacity:0.85;margin-bottom:6px;">🌏 LET'S DO IT! VIETNAM</div>
      <div style="font-size:20px;font-weight:800;">{{subject}}</div>
    </div>
    <div style="padding:28px 24px;color:#1e293b;font-size:14px;line-height:1.7;">
      <p style="margin:0 0 12px;">Hi <strong>{{to_name}}</strong>,</p>
      <p style="margin:0 0 16px;white-space:pre-line;">{{message}}</p>
      <p style="margin:24px 0 0;">Best regards,<br/><strong>The Let's Do It! Vietnam Team</strong></p>
    </div>
    <div style="background:#f1f5f9;padding:16px 24px;text-align:center;font-size:11px;color:#94a3b8;">
      This email was sent to {{to_email}} because you registered to volunteer with Let's Do It! Vietnam.<br/>
      letsdoitvietnam.online
    </div>
  </div>
</div>
